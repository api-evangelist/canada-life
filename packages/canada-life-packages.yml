distribution_note: >-
  Canada Life's machine-to-machine integration for the Canadian market is ACORD XML for
  Life over the CLIEDIS channel, consumed through distributor and MGA software (illustration
  systems, e-application front ends, Book-of-Business tooling) rather than through a
  Canada Life-published SDK. The client libraries in this market belong to the
  distributor-software vendors, not to the carrier.
