- url: https://api.canadalife.com/oauth2/v1/jwks
  type: Authentication
  status: 200
  note: RSA JWKS confirming RS256 token signing.
- url: https://www.cliedis.ca/
  type: Standards
  status: 200
  note: CLIEDIS — Canadian Life Insurance EDI Standards. Announces ACORD XML for
    Life v2.48 in the CAIR tool; covers e-app, pending policy and Book of Business
    feeds.
- url: https://www.cliedis.ca/who-we-are/members
  type: Standards
  status: 200
  note: Confirms Canada Life as a CLIEDIS carrier member. This is the ACORD evidence.
